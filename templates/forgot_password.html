{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-xl-6 col-lg-7">

        <!-- TITLE -->
        <div class="text-center mb-4">

            <img src="{{ url_for('static', filename='images/logo.png') }}"
                 style="max-width: 140px; margin-bottom: 1.5rem;">

            <h1 class="neon-text mb-2" style="font-size: 2rem;">
                RESET PASSWORD
            </h1>

            <p class="text-muted">
                Enter username, email and new password
            </p>

        </div>

        <!-- CARD -->
        <div class="glass-card form-sheet">

            {% if error %}
                <p style="color:red; text-align:center;">
                    {{ error }}
                </p>
            {% endif %}

            <form method="POST">

                <div class="row g-4">

                    <!-- USERNAME -->
                    <div class="col-12">
                        <label class="form-label">Username</label>

                        <input type="text"
       name="username"
       class="form-control form-control-lg bg-dark text-white border-secondary"
       placeholder="Username"
       pattern="^[a-zA-Z][a-zA-Z0-9._]{2,29}$"
       title="Username must start with a letter and can contain letters, numbers, dots and underscores only"
       required>
                    </div>

                    <!-- EMAIL -->
                    <div class="col-12">
                        <label class="form-label">Email</label>

                        <input type="email"
                               name="email"
                               class="form-control form-control-lg bg-dark text-white border-secondary"
                               placeholder="Enter Email"
                               required>
                    </div>

                    <!-- NEW PASSWORD -->
                    <div class="col-12">

                        <label class="form-label">New Password</label>

                        <div class="position-relative">

                            <input type="password"
                                   id="new_password"
                                   name="new_password"
                                   class="form-control form-control-lg bg-dark text-white border-secondary pe-5"
                                   placeholder="New Password"
                                   required>

                            

                        </div>

                        <small class="text-info">
                            Password must contain uppercase,
                            lowercase, number and special character
                        </small>

                    </div>

                    <!-- CONFIRM PASSWORD -->
                    <div class="col-12">

                        <label class="form-label">Confirm Password</label>

                        <div class="position-relative">

                            <input type="password"
                                   id="confirm_password"
                                   name="confirm_password"
                                   class="form-control form-control-lg bg-dark text-white border-secondary pe-5"
                                   placeholder="Confirm Password"
                                   required>

                            

                        </div>

                    </div>

                    <!-- BUTTON -->
                    <div class="col-12 text-center pt-3">

                        <button class="btn btn-accent btn-lg px-5">
                            Reset Password
                        </button>

                    </div>

                    <!-- LOGIN LINK -->
                    <div class="col-12 text-center">

                        <p class="text-muted">
                            Remembered password?

                            <a href="/login-page" style="color:#00d4ff;">
                                Login
                            </a>
                        </p>

                    </div>

                </div>

            </form>

        </div>

    </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">



{% endblock %}
