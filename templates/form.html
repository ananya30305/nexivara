{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {

    function updateRangeValue(rangeId, valueId) {
        const range = document.getElementById(rangeId);
        const value = document.getElementById(valueId);

        if (!range || !value) return;

        value.innerText = range.value;

        range.addEventListener("input", () => {
            value.innerText = range.value;
        });
    }

    updateRangeValue("focusRange", "focusValue");
    updateRangeValue("financeRange", "financeValue");
new TomSelect("#skillsSelect", {
    plugins: ['remove_button'],
    placeholder: "Select your skills...",

    maxItems: null,
    closeAfterSelect: false,
    hideSelected: true,
    allowEmptyOption: true,

    // 🔥 FIXES YOUR PROBLEM
    maxOptions: 1000,   // increase limit

    searchField: ['text', 'value'], // better search

    sortField: [
        {field: "text", direction: "asc"}
    ]
});

});
</script>
{% endblock %}
